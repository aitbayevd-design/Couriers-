<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Показатели курьеров</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0B0F;
    --card:#14161C;
    --card-border:rgba(255,255,255,0.07);
    --text:#F2F3F5;
    --muted:#8A8D96;
    --blue:#5B9BFF;
    --green:#33D399;
    --green-bg:rgba(51,211,153,0.12);
    --red:#F9776E;
    --red-bg:rgba(249,119,110,0.12);
    --amber:#F0B84B;
    --pink:#F9776E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .page{max-width:1400px;margin:0 auto;padding:28px 24px 60px;}

  /* ---------- Summary ---------- */
  .summary{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
    margin-bottom:24px;
  }
  .stat{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:14px;
    padding:20px 22px;
  }
  .stat .label{
    font-size:12px;
    color:var(--muted);
    letter-spacing:.06em;
    text-transform:uppercase;
    margin-bottom:14px;
  }
  .stat .value{
    font-size:32px;
    font-weight:700;
    line-height:1;
    margin-bottom:8px;
  }
  .stat .sub{font-size:13px;color:var(--muted);}
  .stat.blue .value{color:var(--blue);}
  .stat.green .value{color:var(--green);}
  .stat.red .value{color:var(--red);}
  .stat.pink .value{color:var(--pink);}

  /* ---------- Filters ---------- */
  .filters{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:24px;
    flex-wrap:wrap;
  }
  .filters .label{color:var(--muted);font-size:14px;margin-right:4px;}
  .filter-btn{
    background:transparent;
    border:1px solid var(--card-border);
    color:var(--muted);
    padding:8px 16px;
    border-radius:999px;
    font-size:13.5px;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    transition:all .15s ease;
  }
  .filter-btn:hover{border-color:rgba(255,255,255,0.18);color:var(--text);}
  .filter-btn.active{
    background:rgba(91,155,255,0.14);
    border-color:var(--blue);
    color:var(--blue);
  }

  /* ---------- Grid of cards ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:14px;
    padding:20px;
    border-left:3px solid var(--red);
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .card.status-good{border-left-color:var(--green);}
  .card.status-warn{border-left-color:var(--amber);}
  .card.status-bad{border-left-color:var(--red);}

  .card-head{display:flex;align-items:center;gap:12px;}
  .avatar{
    width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;color:#fff;flex:none;
  }
  .card-head .name{font-size:16px;font-weight:600;}

  .metric-row .row-top{
    display:flex;align-items:baseline;justify-content:space-between;
    font-size:13.5px;margin-bottom:8px;
  }
  .metric-row .row-top .m-label{color:var(--muted);}
  .metric-row .row-top .m-value{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;font-size:14px;
  }
  .metric-row .row-top .m-value .delta{
    font-size:12.5px;font-weight:600;margin-left:4px;
  }
  .bar-track{
    height:7px;border-radius:4px;
    background:rgba(255,255,255,0.06);
    overflow:hidden;
  }
  .bar-fill{height:100%;border-radius:4px;}
  .bar-fill.good{background:var(--green);}
  .bar-fill.bad{background:var(--red);}

  .badges{display:flex;gap:8px;flex-wrap:wrap;}
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    padding:5px 10px;border-radius:999px;
    font-size:12.5px;font-weight:600;
  }
  .badge .dot{width:6px;height:6px;border-radius:50%;}
  .badge.accept{background:var(--green-bg);color:var(--green);}
  .badge.accept .dot{background:var(--green);}
  .badge.reject{background:var(--red-bg);color:var(--red);}
  .badge.reject .dot{background:var(--red);}

  .card-foot{
    display:flex;align-items:center;justify-content:space-between;
    padding-top:10px;border-top:1px solid var(--card-border);
    font-size:13px;
  }
  .card-foot .time-label{color:var(--muted);}
  .card-foot .time-value{
    font-family:'IBM Plex Mono',monospace;font-weight:600;margin-left:4px;
  }
  .card-foot .time-value.up{color:var(--amber);}
  .card-foot .time-value.down{color:var(--green);}
  .card-foot .arrow{font-size:12px;}
  .dev-btn{
    background:var(--red-bg);color:var(--red);
    border:none;padding:6px 12px;border-radius:8px;
    font-size:12.5px;font-weight:600;cursor:default;
  }

  @media (max-width:1150px){
    .summary{grid-template-columns:repeat(2,1fr);}
    .grid{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:640px){
    .summary{grid-template-columns:1fr;}
    .grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="page">

  <section class="summary" id="summary"></section>

  <div class="filters" id="filters">
    <span class="label">Показать:</span>
    <button class="filter-btn active" data-filter="all">Все</button>
    <button class="filter-btn" data-filter="onPlan">Выполняют план</button>
    <button class="filter-btn" data-filter="behind">Отстают по часам</button>
    <button class="filter-btn" data-filter="lowAccept">% принятия &lt; 80%</button>
  </div>

  <section class="grid" id="grid"></section>

</div>

<script>
const TARGET_HOURS = 216;
const TARGET_TIME = 40.0;
const TARGET_ACCEPT = 80;

const colors = ["#3B6FE0","#1F6B4C","#8A2E2E","#6B4A20","#5B3B8C","#2E7D7A","#8C2E63","#2E6B8C","#5C6B1F","#3D3B8C"];

const data = [
  { name:"Айтбай Исатай",      hours:203, delta:13,  avgTime:53.2, accepted:7,  declined:12 },
  { name:"Есенбек Ернар",      hours:257, delta:-41, avgTime:57.1, accepted:18, declined:18 },
  { name:"Котов Вячеслав",     hours:97,  delta:119, avgTime:45.0, accepted:26, declined:15 },
  { name:"Нурсейт Аслан",      hours:268, delta:-52, avgTime:43.0, accepted:45, declined:16 },
  { name:"Сарсенбаев Саят",    hours:250, delta:-34, avgTime:40.2, accepted:21, declined:11 },
  { name:"Ташимов Азамат",     hours:279, delta:-63, avgTime:42.1, accepted:30, declined:13 },
  { name:"Ташимов Бауыржан",   hours:227, delta:-11, avgTime:42.3, accepted:27, declined:5  },
  { name:"Желдербаев Жасулан", hours:230, delta:-14, avgTime:42.7, accepted:22, declined:1  },
  { name:"Байкадамов Бекежан", hours:258, delta:-42, avgTime:37.7, accepted:48, declined:26 },
  { name:"Тугелбаев Досбол",   hours:278, delta:-62, avgTime:41.8, accepted:33, declined:15 },
].map((d,i) => ({
  ...d,
  accept: Math.round((d.accepted/(d.accepted+d.declined))*100),
  color: colors[i % colors.length],
  initials: d.name.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase()
}));

function onPlan(d){ return d.delta <= 0; }
function lowAccept(d){ return d.accept < TARGET_ACCEPT; }
function overallStatus(d){
  const hoursOk = onPlan(d);
  const acceptOk = d.accept >= TARGET_ACCEPT;
  if(hoursOk && acceptOk) return "good";
  if(hoursOk || d.accept >= 60) return "warn";
  return "bad";
}

function renderSummary(){
  const onPlanCount = data.filter(onPlan).length;
  const avgAccept = (data.reduce((s,d)=>s+d.accept,0)/data.length);
  const reachedCount = data.filter(d=>d.accept>=TARGET_ACCEPT).length;

  document.getElementById('summary').innerHTML = `
    <div class="stat blue">
      <div class="label">Курьеров</div>
      <div class="value">${data.length}</div>
      <div class="sub">в группе</div>
    </div>
    <div class="stat ${onPlanCount>0?'green':'red'}">
      <div class="label">Выполняют план часов</div>
      <div class="value">${onPlanCount}</div>
      <div class="sub">из ${data.length} человек</div>
    </div>
    <div class="stat pink">
      <div class="label">Среднее % принятия</div>
      <div class="value">${avgAccept.toFixed(1)}%</div>
      <div class="sub">цель: ${TARGET_ACCEPT}%</div>
    </div>
    <div class="stat green">
      <div class="label">Достигли цели %</div>
      <div class="value">${reachedCount}</div>
      <div class="sub">из ${data.length} человек</div>
    </div>
  `;
}

function cardHTML(d){
  const status = overallStatus(d);
  const hoursPct = Math.min(100, (d.hours/TARGET_HOURS)*100);
  const hoursGood = d.delta <= 0;
  const deltaLabel = d.delta <= 0 ? `+${Math.abs(d.delta)} ч` : `-${d.delta} ч`;
  const acceptPct = Math.min(100, d.accept);
  const acceptGood = d.accept >= TARGET_ACCEPT;
  const timeAbove = d.avgTime > TARGET_TIME;
  const timeClass = timeAbove ? 'up' : 'down';
  const timeArrow = timeAbove ? '↑' : '↓';

  return `
  <div class="card status-${status}" data-name="${d.name}">
    <div class="card-head">
      <div class="avatar" style="background:${d.color}">${d.initials}</div>
      <div class="name">${d.name}</div>
    </div>

    <div class="metric-row">
      <div class="row-top">
        <span class="m-label">Часы</span>
        <span class="m-value">${d.hours} / ${TARGET_HOURS}
          <span class="delta" style="color:${hoursGood?'var(--green)':'var(--red)'}">${deltaLabel}</span>
        </span>
      </div>
      <div class="bar-track"><div class="bar-fill ${hoursGood?'good':'bad'}" style="width:${hoursPct}%"></div></div>
    </div>

    <div class="metric-row">
      <div class="row-top">
        <span class="m-label">% принятия</span>
        <span class="m-value" style="color:${acceptGood?'var(--green)':'var(--red)'}">${d.accept}%</span>
      </div>
      <div class="bar-track"><div class="bar-fill ${acceptGood?'good':'bad'}" style="width:${acceptPct}%"></div></div>
    </div>

    <div class="badges">
      <span class="badge accept"><span class="dot"></span>Принял: ${d.accepted}</span>
      <span class="badge reject"><span class="dot"></span>Отклонил: ${d.declined}</span>
    </div>

    <div class="card-foot">
      <div><span class="time-label">Ср. время</span><span class="time-value ${timeClass}">${d.avgTime.toFixed(1)} мин <span class="arrow">${timeArrow}</span></span></div>
      <button class="dev-btn">Отклонения</button>
    </div>
  </div>`;
}

let currentFilter = "all";

function renderGrid(){
  let rows = data;
  if(currentFilter === "onPlan") rows = data.filter(onPlan);
  if(currentFilter === "behind") rows = data.filter(d=>!onPlan(d));
  if(currentFilter === "lowAccept") rows = data.filter(lowAccept);
  document.getElementById('grid').innerHTML = rows.map(cardHTML).join('');
}

document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderGrid();
  });
});

renderSummary();
renderGrid();
</script>
</body>
</html>
